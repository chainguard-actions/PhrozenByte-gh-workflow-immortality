name: Test owner_repos mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action loading all owner repos
        id: action
        uses: .
        continue-on-error: true
        with:
          secret: ${{ github.token }}
          owner_repos: "true"

      - name: Assert action ran with owner_repos (not skipped or cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action step was skipped or cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with owner_repos (outcome=$OUTCOME)"
