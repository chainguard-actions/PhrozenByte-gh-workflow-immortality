name: Test owner_repos mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action loading a specific repo (simulating owner_repos scenario)
        id: action
        uses: .
        with:
          secret: ${{ github.token }}
          repos: octocat/Spoon-Knife

      - name: Assert action completed successfully
        run: |
          echo "Action completed successfully"
          echo "PASS"
