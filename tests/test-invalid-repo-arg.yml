name: Test invalid repository argument fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid repo name (no slash)
        id: action
        uses: .
        continue-on-error: true
        with:
          secret: dummy-token
          repos: "invalid-repo-without-slash"

      - name: Assert action failed due to invalid repo argument
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid repo argument, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid repo argument"
