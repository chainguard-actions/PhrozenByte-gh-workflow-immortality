name: Test mutually exclusive options no_repo_names and verbose fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with mutually exclusive options (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          secret: dummy-token
          no_repo_names: "true"
          verbose: "true"
          repos: "some/repo"

      - name: Assert action failed due to mutually exclusive options
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when no_repo_names and verbose are both true, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when no_repo_names and verbose are mutually exclusive"
