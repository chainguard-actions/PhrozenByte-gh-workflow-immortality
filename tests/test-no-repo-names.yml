name: Test no_repo_names mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no_repo_names enabled on a repo with no workflows
        id: action
        uses: .
        with:
          secret: ${{ github.token }}
          repos: octocat/Spoon-Knife
          no_repo_names: "true"

      - name: Assert action completed successfully with no_repo_names
        run: |
          echo "Action completed with no_repo_names mode successfully"
          echo "PASS"
