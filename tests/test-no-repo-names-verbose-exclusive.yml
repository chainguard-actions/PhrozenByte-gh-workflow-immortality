name: Test no_repo_names and verbose are mutually exclusive
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with both no_repo_names and verbose (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          secret: invalid-token-for-testing
          repos: "PhrozenByte/gh-workflow-immortality"
          no_repo_names: "true"
          verbose: "true"

      - name: Assert action failed due to mutually exclusive options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no_repo_names and verbose are both set, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no_repo_names and verbose are mutually exclusive"
