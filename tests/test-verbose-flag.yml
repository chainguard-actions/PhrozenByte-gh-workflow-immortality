name: Test verbose flag is accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with verbose flag and invalid token (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          secret: invalid-token-for-testing
          repos: "PhrozenByte/gh-workflow-immortality"
          verbose: "true"

      - name: Assert action failed (verbose flag accepted, API call failed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token (verbose mode), but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with verbose flag and invalid token"
