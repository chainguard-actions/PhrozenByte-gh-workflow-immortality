name: Test no repos specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no repo sources (expect failure)
        id: action
        uses: .
        with:
          secret: fake-token-for-testing
          owner_repos: false
          collaborator_repos: false
          member_repos: false
          users: ""
          orgs: ""
          repos: ""
        continue-on-error: true

      - name: Assert action failed (no repos or invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no repos specified and token is invalid"
            exit 1
          fi
          echo "PASS: action correctly failed"
